name: Nintendo Switch Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tja-parser:
    name: Test TJA parser (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile parser tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/tja_parser_test.cpp -o tja-parser-test
      - name: Run parser tests
        run: ./tja-parser-test

  validate-generator:
    name: Validate desktop generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile tools/tja_autogen.py

  build-switch:
    name: Build Taiko2Switch NRO
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: make -j2
      - name: Stage artifact
        run: |
          mkdir -p dist
          test -f Taiko2Switch.nro
          cp Taiko2Switch.nro dist/
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: Taiko2Switch-NRO
          path: dist/Taiko2Switch.nro
          if-no-files-found: error
          retention-days: 14
